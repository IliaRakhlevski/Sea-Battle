# Build and test on every push, with three compilers and with sanitizers.
name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false        # one red job must not hide the others
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cxx: g++
            options: ""
          - name: Linux Clang
            os: ubuntu-latest
            cxx: clang++
            options: ""
          - name: Linux GCC + sanitizers
            os: ubuntu-latest
            cxx: g++
            options: -DSEABATTLE_SANITIZE=ON
          - name: Windows MSVC
            os: windows-latest
            cxx: ""
            options: ""

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then export CXX=${{ matrix.cxx }}; fi
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DSEABATTLE_WERROR=ON ${{ matrix.options }}

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure
