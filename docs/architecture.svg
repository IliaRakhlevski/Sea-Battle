<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760"
     font-family="'DejaVu Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <title>Sea Battle - module layout</title>
  <desc>How the console application, the game library and the plain types underneath depend on one another.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#455a64"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
    <marker id="hollow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" stroke="#8d6e63" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="1000" height="760" fill="#ffffff"/>

  <!-- ============================== bands (labels top right) ============================== -->
  <rect x="16" y="16"  width="968" height="108" rx="8" fill="#fff4ec" stroke="#e0b9a0"/>
  <text x="32" y="34" font-size="12" font-weight="bold" fill="#8d4f2a">app/console</text>
  <text x="32" y="48" font-size="10" fill="#a9724f">the only place with std::cout and std::cin</text>

  <rect x="16" y="144" width="968" height="428" rx="8" fill="#f2f8fd" stroke="#a8c7e0"/>
  <text x="32" y="162" font-size="12" font-weight="bold" fill="#1d5c8f">include/seabattle</text>
  <text x="32" y="176" font-size="10" fill="#4a7fa8">the game: no input, no output</text>

  <rect x="16" y="612" width="968" height="104" rx="8" fill="#f5f5f5" stroke="#cccccc"/>
  <text x="32" y="630" font-size="12" font-weight="bold" fill="#555555">foundation</text>
  <text x="32" y="644" font-size="10" fill="#777777">plain types - nothing here knows the game exists</text>

  <!-- ============================== app row ============================== -->
  <g stroke="#8d4f2a" fill="#ffffff">
    <rect x="40"  y="60" width="180" height="48" rx="6"/>
    <rect x="250" y="60" width="190" height="48" rx="6"/>
    <rect x="500" y="60" width="212" height="48" rx="6"/>
    <rect x="750" y="60" width="212" height="48" rx="6"/>
  </g>
  <g text-anchor="middle" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#5d3317">
    <text x="130" y="83">main.cpp</text>
    <text x="345" y="83">ConsoleView</text>
    <text x="606" y="83">ManualPlacement</text>
    <text x="856" y="83">ManualTargeting</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#a9724f">
    <text x="130" y="98">wires it up and starts</text>
    <text x="345" y="98">draws both boards</text>
    <text x="606" y="98">asks where the ships go</text>
    <text x="856" y="98">asks where to shoot</text>
  </g>

  <!-- ============================== library: classes ============================== -->
  <g stroke="#1d5c8f" fill="#ffffff">
    <rect x="40"  y="192" width="176" height="48" rx="6"/>
    <rect x="40"  y="304" width="190" height="48" rx="6"/>
    <rect x="640" y="304" width="190" height="48" rx="6"/>
    <rect x="40"  y="430" width="150" height="44" rx="6"/>
    <rect x="210" y="430" width="150" height="44" rx="6"/>
  </g>
  <g text-anchor="middle" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#123f61">
    <text x="128" y="215">Session</text>
    <text x="135" y="327">Player</text>
    <text x="735" y="327">Player</text>
    <text x="115" y="452">OwnBoard</text>
    <text x="285" y="452">EnemyMap</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#4a7fa8">
    <text x="128" y="230">the toss, the turns, the events</text>
    <text x="135" y="342">first</text>
    <text x="735" y="342">second</text>
    <text x="115" y="466">own ships and their damage</text>
    <text x="285" y="466">what shooting has revealed</text>
  </g>

  <!-- ============================== library: interfaces ============================== -->
  <g stroke="#8d6e63" fill="#fffdf6" stroke-dasharray="6 3">
    <rect x="300" y="192" width="190" height="48" rx="6"/>
    <rect x="330" y="304" width="210" height="48" rx="6"/>
    <rect x="390" y="430" width="230" height="44" rx="6"/>
    <rect x="650" y="430" width="220" height="44" rx="6"/>
  </g>
  <g text-anchor="middle" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="13" fill="#5d4037">
    <text x="395" y="215">IGameObserver</text>
    <text x="435" y="327">IShootable</text>
    <text x="505" y="452">IPlacementStrategy</text>
    <text x="760" y="452">ITargetingStrategy</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#8d6e63">
    <text x="395" y="230">Observer</text>
    <text x="435" y="342">whatever can be shot at</text>
    <text x="505" y="466">Strategy</text>
    <text x="760" y="466">Strategy</text>
  </g>

  <!-- ============================== foundation: types, file underneath ============================== -->
  <g stroke="#bbbbbb" fill="#ffffff">
    <rect x="40"  y="656" width="142" height="46" rx="5"/>
    <rect x="194" y="656" width="142" height="46" rx="5"/>
    <rect x="348" y="656" width="142" height="46" rx="5"/>
    <rect x="502" y="656" width="142" height="46" rx="5"/>
    <rect x="656" y="656" width="142" height="46" rx="5"/>
    <rect x="810" y="656" width="142" height="46" rx="5"/>
  </g>
  <g text-anchor="middle" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="12" fill="#444444">
    <text x="111" y="676">Coords, Placement</text>
    <text x="265" y="676">Rect, ring_around</text>
    <text x="419" y="676">fleet, board_size</text>
    <text x="573" y="676">Grid2D&lt;T&gt;</text>
    <text x="727" y="676">Ship</text>
    <text x="881" y="676">ShotResult</text>
  </g>
  <g text-anchor="middle" font-size="10" fill="#888888">
    <text x="111" y="692">coord.hpp</text>
    <text x="265" y="692">board_area.hpp</text>
    <text x="419" y="692">rules.hpp</text>
    <text x="573" y="692">grid2d.hpp</text>
    <text x="727" y="692">ship.hpp</text>
    <text x="881" y="692">shot_result.hpp</text>
  </g>

  <!-- ============================== solid edges ============================== -->
  <g stroke="#455a64" fill="none" stroke-width="1.3">
    <path d="M 190 108 L 190 192" marker-end="url(#arrow)"/>              <!-- main -> Session -->
    <path d="M 216 216 L 300 216" marker-end="url(#arrow)"/>              <!-- Session -> IGameObserver -->
    <path d="M 100 240 L 100 304" marker-end="url(#arrow)"/>              <!-- Session -> Player 1 -->
    <path d="M 170 240 L 170 272 L 735 272 L 735 304" marker-end="url(#arrow)"/>  <!-- Session -> Player 2 -->
    <path d="M 230 328 L 330 328" marker-end="url(#arrow)"/>              <!-- Player -> IShootable -->

    <!-- Player owns its boards and holds its strategies: one trunk, one bus, four drops -->
    <path d="M 135 352 L 135 396"/>
    <path d="M 115 396 L 760 396"/>
    <path d="M 115 396 L 115 430" marker-end="url(#arrow)"/>
    <path d="M 285 396 L 285 430" marker-end="url(#arrow)"/>
    <path d="M 505 396 L 505 430" marker-end="url(#arrow)"/>
    <path d="M 760 396 L 760 430" marker-end="url(#arrow)"/>
  </g>
  <circle cx="135" cy="396" r="3" fill="#455a64"/>

  <!-- ============================== dashed edges: implements ============================== -->
  <g stroke="#8d6e63" fill="none" stroke-dasharray="5 4" stroke-width="1.2" marker-end="url(#hollow)">
    <path d="M 345 108 L 345 192"/>                                       <!-- ConsoleView -> IGameObserver -->
    <path d="M 606 108 L 606 430"/>                                       <!-- ManualPlacement -> IPlacementStrategy -->
    <path d="M 856 108 L 856 430"/>                                       <!-- ManualTargeting -> ITargetingStrategy -->
    <path d="M 640 328 L 540 328"/>                                       <!-- Player 2 -> IShootable -->
  </g>

  <!-- ============================== edge labels ============================== -->
  <g font-size="10" fill="#455a64">
    <text x="198" y="138">starts the game</text>
    <text x="224" y="210">notifies</text>
    <text x="106" y="278">owns</text>
    <text x="520" y="267">owns</text>
    <text x="240" y="322">shoots at</text>
    <text x="160" y="391">owns</text>
    <text x="640" y="391">holds by unique_ptr</text>
  </g>
  <g font-size="10" fill="#8d6e63">
    <text x="353" y="138">implements</text>
    <text x="552" y="322">implements</text>
  </g>
  <text x="435" y="370" text-anchor="middle" font-size="10" fill="#8d6e63">and the same the other way round</text>

  <!-- ============================== fog of war ============================== -->
  <path d="M 760 474 L 760 494 L 285 494 L 285 474" stroke="#2e7d32" fill="none"
        stroke-width="1.4" marker-end="url(#arrowg)"/>
  <rect x="300" y="506" width="560" height="40" rx="5" fill="#f1f8e9" stroke="#a5d6a7"/>
  <text x="580" y="522" text-anchor="middle" font-size="11" fill="#2e7d32">A targeting strategy is handed the knowledge map and nothing else.</text>
  <text x="580" y="538" text-anchor="middle" font-size="11" fill="#2e7d32">OwnBoard is not even visible from its header: the fog of war is a dependency, not a promise.</text>

  <!-- ============================== library -> foundation ============================== -->
  <path d="M 500 572 L 500 611" stroke="#455a64" fill="none" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="512" y="596" font-size="10" fill="#455a64">every class above is built from these</text>

  <!-- ============================== legend ============================== -->
  <g font-size="11" fill="#546e7a">
    <path d="M 40 738 L 88 738" stroke="#455a64" fill="none" stroke-width="1.3" marker-end="url(#arrow)"/>
    <text x="96" y="742">owns or uses</text>
    <path d="M 200 738 L 248 738" stroke="#8d6e63" fill="none" stroke-dasharray="5 4" marker-end="url(#hollow)"/>
    <text x="256" y="742">implements</text>
    <rect x="370" y="730" width="16" height="14" rx="3" fill="#fffdf6" stroke="#8d6e63" stroke-dasharray="4 2"/>
    <text x="394" y="742">an interface: the seam an outsider plugs into</text>
    <text x="700" y="742">Dependencies point downwards, never up.</text>
  </g>
</svg>
