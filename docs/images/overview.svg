<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <defs>
    <marker id="aDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="aHollow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff" stroke="#9a3412" stroke-width="1.4"/></marker>
  </defs>

  <rect width="1120" height="450" fill="#f8fafc"/>

  <!-- ============ Console application ============ -->
  <rect x="20" y="20" width="1080" height="95" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="44" y="60" font-size="24" font-weight="700" fill="#0f172a">Console application</text>
  <text x="44" y="88" font-size="16" fill="#475569">app/console · the only code with std::cin / std::cout</text>
  <g fill="#ffffff" stroke="#ea580c" stroke-width="2">
    <rect x="560" y="40" width="170" height="50" rx="10"/>
    <rect x="740" y="40" width="170" height="50" rx="10"/>
    <rect x="920" y="40" width="170" height="50" rx="10"/>
  </g>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#7c2d12" text-anchor="middle">
    <text x="645" y="71">ConsoleView</text>
    <text x="825" y="71">ManualPlacement</text>
    <text x="1005" y="71">ManualTargeting</text>
  </g>


  <!-- ============ Game library ============ -->
  <rect x="20" y="150" width="1080" height="210" rx="14" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="44" y="188" font-size="24" font-weight="700" fill="#0f172a">Game library</text>
  <text x="44" y="214" font-size="16" fill="#475569">include/seabattle · C++17 · no input, no output</text>

  <g fill="#ffffff" stroke="#1d4ed8" stroke-width="2">
    <rect x="44" y="250" width="120" height="70" rx="10"/>
    <rect x="190" y="250" width="150" height="70" rx="10"/>
    <rect x="380" y="250" width="150" height="70" rx="10"/>
  </g>
  <g text-anchor="middle">
    <text x="104" y="280" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="700" fill="#1e3a8a">Session</text>
    <text x="104" y="304" font-size="14" fill="#475569">turns, coin toss</text>
    <text x="265" y="280" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="700" fill="#1e3a8a">Player</text>
    <text x="265" y="304" font-size="14" fill="#475569">board + enemy map</text>
    <text x="455" y="280" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" font-weight="700" fill="#1e3a8a">Player</text>
    <text x="455" y="304" font-size="14" fill="#475569">board + enemy map</text>
  </g>

  <!-- Session owns both players -->
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#aDark)">
    <line x1="166" y1="285" x2="186" y2="285"/>
    <path d="M104,322 L104,340 L455,340 L455,324"/>
  </g>
  <!-- shots between players -->
  <line x1="344" y1="285" x2="376" y2="285" stroke="#334155" stroke-width="2" marker-start="url(#aDark)" marker-end="url(#aDark)"/>
  <text x="360" y="242" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#9a3412" text-anchor="middle">IShootable</text>

  <!-- interfaces -->
  <g fill="#fffbeb" stroke="#9a3412" stroke-width="2" stroke-dasharray="7 4">
    <rect x="560" y="250" width="170" height="70" rx="10"/>
    <rect x="740" y="250" width="170" height="70" rx="10"/>
    <rect x="920" y="250" width="170" height="70" rx="10"/>
  </g>
  <g text-anchor="middle">
    <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" font-weight="700" fill="#7c2d12">
      <text x="645" y="280">IGameObserver</text>
      <text x="825" y="280">IPlacementStrategy</text>
      <text x="1005" y="280">ITargetingStrategy</text>
    </g>
    <g font-size="14" fill="#475569">
      <text x="645" y="304">game events out</text>
      <text x="825" y="304">human or computer</text>
      <text x="1005" y="304">human or computer</text>
    </g>
    <text x="825" y="346" font-size="15" font-weight="600" fill="#9a3412">Observer · Strategy · Dependency injection</text>
  </g>

  <!-- implements -->
  <g stroke="#9a3412" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-end="url(#aHollow)">
    <line x1="645" y1="92" x2="645" y2="246"/>
    <line x1="825" y1="92" x2="825" y2="246"/>
    <line x1="1005" y1="92" x2="1005" y2="246"/>
  </g>
  <rect x="514" y="122" width="118" height="22" fill="#f8fafc"/>
  <text x="630" y="138" font-size="15" font-style="italic" fill="#9a3412" text-anchor="end">implements</text>
  <!-- ============ Bottom row ============ -->
  <rect x="20" y="385" width="530" height="50" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="44" y="416" font-size="16" fill="#1e293b"><tspan font-weight="700">Foundation</tspan><tspan dx="14">Coords · Grid2D&lt;T&gt; · Ship · ShotResult · rules</tspan></text>

  <rect x="570" y="385" width="530" height="50" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="594" y="416" font-size="16" fill="#1e293b"><tspan font-weight="700">Tests &amp; CI</tspan><tspan dx="14">6 test programs · GCC · Clang · MSVC · sanitizers</tspan></text>
</svg>
